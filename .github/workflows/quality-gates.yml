name: Quality Gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality-gates:
    name: quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install quality-gate dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-quality.txt
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          if [ -f backend/requirements.txt ]; then
            python -m pip install -r backend/requirements.txt
          fi

      - name: Record revision, environment, and tracked application scope
        id: scope
        run: |
          mkdir -p gate-evidence
          git rev-parse HEAD | tee gate-evidence/revision.txt
          python --version | tee gate-evidence/python.txt
          python -m pip freeze > gate-evidence/environment.txt
          python tools/docs/gate_scope.py | tee gate-evidence/scope.json
          python tools/docs/gate_scope.py --github-output >> "$GITHUB_OUTPUT"

      - name: Ruff lint
        run: python -m ruff check . 2>&1 | tee gate-evidence/ruff-lint.txt

      - name: Ruff format check
        run: |
          python -m ruff format --diff . > gate-evidence/ruff-format.diff || true
          python -m ruff format --check . 2>&1 | tee gate-evidence/ruff-format.txt

      - name: Validate requirement documentation links and traceability
        run: python tools/docs/validate_t2.py 2>&1 | tee gate-evidence/t2-validation.txt

      - name: Verify quality gates with passing and failing disposable fixtures
        run: python tools/docs/verify_quality_gates.py --output gate-evidence/fixtures.json 2>&1 | tee gate-evidence/fixtures.txt

      - name: Pytest and coverage
        shell: bash
        run: |
          if [ "${{ steps.scope.outputs.application }}" = "true" ]; then
            python -m pytest -q --cov=. --cov-report=term-missing --cov-report=xml:coverage.xml 2>&1 | tee gate-evidence/application-tests.txt
            if [ ! -s coverage.xml ]; then
              echo "Coverage XML report missing or empty; failing coverage-evidence gate."
              exit 1
            fi
          else
            echo "NOT APPLICABLE: no tracked application/test source outside tools/docs/. No product tests or product coverage passed." | tee gate-evidence/application-tests.txt
          fi

      - name: Django system and migration checks
        shell: bash
        run: python tools/docs/gate_scope.py --django-checks 2>&1 | tee gate-evidence/django-checks.txt

      - name: Upload gate evidence and any product coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-evidence
          path: |
            gate-evidence/
            coverage.xml
          if-no-files-found: ignore
          retention-days: 90
